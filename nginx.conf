map $uri $drama_admin_cache_control {
    default "no-cache";
    /config.js "no-store";
    /version.json "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # 集中设置缓存头，避免 location 的 add_header 覆盖安全响应头。
    add_header Cache-Control $drama_admin_cache_control;
    # 上传节点由官方动态下发，连接策略按协议放行，避免节点域名变化中断直传。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        try_files $uri =404;
    }

    location = /version.json {
        try_files $uri =404;
    }

    # 优先发送构建时生成的压缩文件；不支持 gzip 的客户端仍接收原文件。
    location /assets/ {
        gzip_static on;
        gzip_vary on;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
